name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  chromium:
    name: Chromium
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the complete reactor in Chromium
      goals: -U clean test
    secrets: inherit

  # Runs the examples in workerd, in a Miniflare container in the runner's own Docker
  # daemon.
  miniflare:
    name: Miniflare
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the complete reactor in workerd
      goals: -U clean test
      maven-args: -Pminiflare
    secrets: inherit

  publish-snapshot:
    if: github.event_name != 'pull_request'
    needs: chromium
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Maven snapshot
      goals: -U deploy
      maven-args: -DskipTests
    secrets: inherit
