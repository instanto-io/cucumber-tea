name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  chromium:
    name: Chromium
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the complete reactor in Chromium
      goals: -U clean test
    secrets: inherit

  # Enable this job by setting the CUCUMBER_TEA_MINIFLARE_CI repository variable to
  # true after sarto-edge-cf-junit has been published to GitHub Packages and a
  # PACKAGES_TOKEN repository secret can read it.
  miniflare:
    name: Miniflare
    if: ${{ vars.CUCUMBER_TEA_MINIFLARE_CI == 'true' }}
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the complete reactor in workerd
      goals: -U clean test
      maven-args: -U -Pminiflare
    secrets: inherit

  publish-snapshot:
    if: github.event_name != 'pull_request'
    needs: chromium
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Maven snapshot
      goals: -U deploy
      maven-args: -DskipTests
    secrets: inherit
